name: Release

# Publishes a GitHub Release for a version tag, with notes generated by the SHARED Conventional-Commit
# changelog generator that lives in the dwc-plugin-runtime repo (single source of truth, fetched at a
# pinned ref) — the same one every Duet plugin uses. The test kit is consumed as a github: dependency,
# so there's no build asset; the Release is just the changelog. Push a version tag to publish:
#
#   git tag v0.2.5 && git push origin v0.2.5

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Shared changelog generator (single source of truth). Pinned to a ref; bump to adopt format changes.
  # Source: jaysuk/dwc-plugin-runtime → scripts/changelog.mjs.
  RUNTIME_REF: d077f81a11bb5af9a35fe39f7b82d789eab19896

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags so the changelog generator can find the previous tag
          fetch-tags: true

      - uses: actions/setup-node@v6
        with: { node-version: 24 }

      # Fetch the shared changelog generator from the runtime repo (single source of truth, pinned ref).
      - name: Fetch shared release-notes generator
        run: curl -fsSL "https://raw.githubusercontent.com/jaysuk/dwc-plugin-runtime/${RUNTIME_REF}/scripts/changelog.mjs" -o "$RUNNER_TEMP/changelog.mjs"

      - name: Generate release notes
        id: changelog
        run: |
          {
            echo 'body<<__CHANGELOG_EOF__'
            node "$RUNNER_TEMP/changelog.mjs"
            echo
            echo '> Consumed as a github dependency: `npm install --save-dev github:jaysuk/dwc-plugin-test-kit#'"${GITHUB_REF_NAME}"'`'
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
